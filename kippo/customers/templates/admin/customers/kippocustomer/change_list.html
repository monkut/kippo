{% extends "admin/change_list.html" %}
{% block extrahead %}{{ block.super }}
{# Toggle the per-project detail table under the アクティブプロジェクト count (KippoCustomerAdmin.get_active_project_count). #}
<script>
(function () {
  "use strict";
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("a.active-projects-toggle").forEach(function (toggle) {
      toggle.addEventListener("click", function (event) {
        event.preventDefault();
        var detail = toggle.parentElement.querySelector(".active-projects-detail");
        if (detail) {
          detail.hidden = !detail.hidden;
        }
      });
    });
  });
})();
</script>
{% endblock %}
