{% extends "admin/change_form.html" %}
{# Copy-to-clipboard handler + inline "コピーしました" status for the MTG calendar #}
{# link readonly fields on the KippoProject change form (kiconiaworks/kippo#13). #}
{% block extrahead %}{{ block.super }}
<style>
    .kippo-copy-field { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .kippo-copy-button { padding: 4px 10px; line-height: 1.2; white-space: nowrap; }
    .kippo-copy-status { font-size: 12px; color: #4f8a10; opacity: 0; transition: opacity 0.15s ease; }
    .kippo-copy-status.is-visible { opacity: 1; }
    .kippo-copy-status--error { color: #ba2121; }
    /* Collapsed nested-admin inline section dividers. When an inline is collapsed, Django/nested_admin
       wraps the inline's section <h2> (which already carries its own ~8px section-bar padding) inside a
       <summary> that adds padding again, so the divider renders ~double height (≈69px) vs the project's
       own collapsible fieldset sections (≈36px, whose <h2> is a padding-less, inline .fieldset-heading).
       Mirror that: make the inline h2 inline + padding-less so the <summary>'s own padding sizes the bar. */
    .djn-fieldset details > summary > h2 { display: inline; padding: 0; margin: 0; }
</style>
<script>
'use strict';
(function () {
    function copyText(text) {
        // navigator.clipboard is undefined in non-secure contexts (admin over plain HTTP /
        // internal IP) and accessing .writeText would throw synchronously — guard + fall back.
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy') ? resolve() : reject();
            } catch (err) {
                reject(err);
            } finally {
                textarea.remove();
            }
        });
    }

    function flashStatus(button, message, isError) {
        // Inline, contextual feedback next to the clicked button. The status span is a
        // polite aria-live region, so assistive tech announces the result too.
        var status = button.parentNode.querySelector('.kippo-copy-status');
        if (!status) {
            return;
        }
        if (status.hideTimer) {
            clearTimeout(status.hideTimer);
        }
        status.textContent = message;
        status.classList.toggle('kippo-copy-status--error', Boolean(isError));
        status.classList.add('is-visible');
        status.hideTimer = setTimeout(function () {
            status.classList.remove('is-visible');
        }, 2000);
    }

    document.addEventListener('click', function (event) {
        var button = event.target.closest('.kippo-copy-button');
        if (!button) {
            return;
        }
        event.preventDefault();
        var text = button.dataset.clipboardText || '';
        copyText(text).then(
            function () { flashStatus(button, 'コピーしました', false); },
            function () { flashStatus(button, 'コピーに失敗しました', true); }
        );
    });
})();
</script>
<script>
'use strict';
// Auto-populate the first contract row's period from the project's start_date / target_date
// as they are entered on the add form. Only fills a contract date that is empty or was itself
// auto-filled — a date the user typed (or a pre-existing contract date on the change form) is
// never clobbered. The model also backfills blank contract dates on save as a safety net.
(function () {
    function mirror(sourceId, targetId) {
        var source = document.getElementById(sourceId);
        var target = document.getElementById(targetId);
        if (!source || !target) {
            return;
        }
        target.addEventListener('input', function () {
            target.dataset.userEdited = 'true';
        });
        function apply() {
            if (target.dataset.userEdited === 'true') {
                return;
            }
            // don't overwrite a value that wasn't placed here by this auto-fill
            if (target.value && target.dataset.autofilled !== 'true') {
                return;
            }
            target.value = source.value;
            target.dataset.autofilled = 'true';
        }
        source.addEventListener('change', apply);
        source.addEventListener('input', apply);
    }

    document.addEventListener('DOMContentLoaded', function () {
        mirror('id_start_date', 'id_contracts-0-start_date');
        mirror('id_target_date', 'id_contracts-0-end_date');
    });
})();
</script>
{% endblock %}
