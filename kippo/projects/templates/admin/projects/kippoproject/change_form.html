{% extends "admin/change_form.html" %}
{# Copy-to-clipboard handler + "コピーしました" toast for the MTG calendar link #}
{# readonly fields on the KippoProject change form (kiconiaworks/kippo#13). #}
{% block extrahead %}{{ block.super }}
<script>
'use strict';
(function () {
    function showToast(message) {
        var toast = document.createElement('div');
        toast.className = 'kippo-copy-toast';
        toast.textContent = message;
        toast.style.cssText = [
            'position:fixed', 'bottom:24px', 'left:50%', 'transform:translateX(-50%)',
            'background:#417690', 'color:#fff', 'padding:10px 18px', 'border-radius:4px',
            'font-size:13px', 'z-index:1100', 'box-shadow:0 2px 6px rgba(0,0,0,0.3)'
        ].join(';');
        document.body.appendChild(toast);
        setTimeout(function () { toast.remove(); }, 2000);
    }

    function copyText(text) {
        // navigator.clipboard is undefined in non-secure contexts (admin over plain HTTP /
        // internal IP) and accessing .writeText would throw synchronously — guard + fall back.
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy') ? resolve() : reject();
            } catch (err) {
                reject(err);
            } finally {
                textarea.remove();
            }
        });
    }

    document.addEventListener('click', function (event) {
        var button = event.target.closest('.kippo-copy-button');
        if (!button) {
            return;
        }
        event.preventDefault();
        var text = button.dataset.clipboardText || '';
        copyText(text).then(
            function () { showToast('コピーしました'); },
            function () { showToast('コピーに失敗しました'); }
        );
    });
})();
</script>
{% endblock %}
